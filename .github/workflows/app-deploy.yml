# App deploy to dev (ADR 0012 L7, L8; ADR 0005; FR-11, FR-14, FR-15).
# A push to main (or a manual run on main) builds the image once, smoke tests and scans it, pushes it to the dev ECR by
# an immutable tag, then releases it on Lambda: UpdateFunctionCode by digest, IMAGE_DIGEST set, PublishVersion, a smoke
# invoke of that version (no traffic yet), then the alias `live` moves all at once or through an alias-weighted canary,
# and /version is read through the HTTP API. Old versions are pruned. The file path is part of the deploy role trust
# (ADR 0007 S2): the bootstrap `workflow_files` must list app-deploy.yml.
# A manual run with mode rollback skips the build: it releases the image ECR already holds for an earlier commit, and
# reuses that commit's version when it still exists (scripts/lambda/publish.sh).
# The function is created by terraform-iac from an image that is already in ECR (ADR 0012 L3): on the first run of the
# environment the deploy pushes, then stops green with a notice until the apply has created the function.
# Two jobs, because `id-token` and `environment` apply to every step of a job: `build-scan` runs the build, the
# smoke test and the scan with no token, no environment and no secret (F9); `deploy` loads exactly the bytes that
# job produced (sha256 checked) and is the only job that can assume the deploy role.
# Jobs that assume an AWS role run harden-runner in block mode with telemetry off and an exact allowlist (ADR 0007 S39).
# Hosts holding the account ID come from secret expressions, never literals. A blocked host fails the job: read its
# name in the log, add it here (the repo-guard workflow enforces the shape).
name: App Deploy
run-name: Deploy ${{ github.ref_name }} to dev by ${{ github.actor }}

on:
  push:
    branches: [main]
    paths:
      - app/**
      - .github/workflows/app-deploy.yml
      - scripts/lib.sh
      - project.env
      - scripts/names.sh
      - scripts/image/smoke.sh
      - scripts/aws/assert-no-account-id.sh
      - scripts/image/build.sh
      - scripts/aws/check-config.sh
      - scripts/ci/tools.sha256
      - scripts/image/ecr-push.sh
      - scripts/image/export.sh
      - scripts/image/import.sh
      - scripts/image/verify.sh
      - scripts/ci/install-tools.sh
      - scripts/image/scan.sh
      - scripts/lambda/release-inputs.sh
      - scripts/lambda/preflight.sh
      - scripts/lambda/resolve-image.sh
      - scripts/lambda/publish.sh
      - scripts/lambda/smoke-invoke.sh
      - scripts/lambda/api-endpoint.sh
      - scripts/lambda/shift-alias.sh
      - scripts/lambda/canary-bake.sh
      - scripts/lambda/verify-live.sh
      - scripts/lambda/prune-versions.sh
      - mise.toml
  # Deploys main HEAD (mode deploy), for example with a canary, or rolls dev back to an earlier commit (mode rollback).
  # Both jobs refuse any other ref.
  workflow_dispatch:
    inputs:
      mode:
        description: deploy builds main HEAD; rollback releases the image of an earlier commit (set sha)
        type: choice
        options: [deploy, rollback]
        default: deploy
      strategy:
        description: all-at-once moves live at once; canary sends canary_percent to the new version for bake_minutes first
        type: choice
        options: [all-at-once, canary]
        default: all-at-once
      canary_percent:
        description: Canary weight in percent (1 to 50)
        type: string
        default: "10"
      bake_minutes:
        description: Canary bake time in minutes (1 to 30)
        type: string
        default: "5"
      sha:
        description: Rollback only. Full 40 hex commit that app-deploy pushed to dev earlier
        type: string
        default: ""

permissions: {}

env:
  # The environment name. The scripts derive every resource name from it (app_names in scripts/lib.sh).
  ENV: dev
  GIT_SHA: ${{ github.sha }}

jobs:
  build-scan:
    name: build, scan
    # Only main builds for a deploy: a branch run would build an image nobody may deploy. A rollback builds nothing.
    if: github.ref == 'refs/heads/main' && inputs.mode != 'rollback'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # No OIDC token, no deployment environment, no secrets: nothing in this job can reach AWS (the CI self-tests check it).
    permissions:
      contents: read
    outputs:
      image-sha256: ${{ steps.export.outputs.sha256 }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install trivy (checksum verified)
        run: scripts/ci/install-tools.sh "$RUNNER_TEMP/tools" trivy

      # Build (the unit tests run inside), smoke test like Lambda/compose, scan. A fixable HIGH or CRITICAL finding
      # blocks the deploy (ADR 0005, Q4).
      - name: Build, smoke test and scan the image
        run: scripts/image/verify.sh "$GIT_SHA" "$RUNNER_TEMP/scan"

      - name: Save the image and compute its sha256
        id: export
        run: scripts/image/export.sh "$GIT_SHA" "$RUNNER_TEMP/image" >> "$GITHUB_OUTPUT"

      # Artifacts on a public repo are downloadable, so the retention is one day. The deploy job checks the sha256.
      - name: Upload the image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-image
          path: ${{ runner.temp }}/image/image.tar
          retention-days: 1
          if-no-files-found: error

  deploy:
    name: deploy (dev)
    needs: build-scan
    # A deploy needs a green build-scan; a rollback runs while build-scan is skipped on purpose.
    if: >-
      !cancelled()
      && github.ref == 'refs/heads/main'
      && (needs.build-scan.result == 'success'
        || (inputs.mode == 'rollback' && needs.build-scan.result == 'skipped'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # The environment adds the required reviewer and sets the OIDC subject the deploy role trusts. Its name cannot
    # come from `env`: the environments context is not available here.
    environment: dev
    # A newer pending run replaces an older pending one, so the latest commit wins. A running deploy is never
    # cancelled. Only this job holds AWS state, so only this job needs the lock.
    concurrency:
      group: app-deploy-dev
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # OIDC token for the role assumed by configure-aws-credentials
    steps:
      # The execute-api host holds the API ID, which exists only after terraform-iac apply: it is the one wildcard
      # family the policy allows, for the canary probes and the live check (ADR 0012 L7).
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          disable-telemetry: true
          # No disable-sudo-and-containers: this job runs docker load and docker push (named exception in the policy).
          allowed-endpoints: >
            github.com:443
            sts.${{ vars.AWS_REGION }}.amazonaws.com:443
            api.ecr.${{ vars.AWS_REGION }}.amazonaws.com:443
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com:443
            prod-${{ vars.AWS_REGION }}-starport-layer-bucket.s3.${{ vars.AWS_REGION }}.amazonaws.com:443
            lambda.${{ vars.AWS_REGION }}.amazonaws.com:443
            apigateway.${{ vars.AWS_REGION }}.amazonaws.com:443
            monitoring.${{ vars.AWS_REGION }}.amazonaws.com:443
            secretsmanager.${{ vars.AWS_REGION }}.amazonaws.com:443
            *.execute-api.${{ vars.AWS_REGION }}.amazonaws.com:443

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Before any input is used: the dispatch inputs reach the script through env only (a push has none: defaults).
      - name: Validate the release inputs
        env:
          MODE: ${{ inputs.mode }}
          STRATEGY: ${{ inputs.strategy }}
          CANARY_PERCENT: ${{ inputs.canary_percent }}
          BAKE_MINUTES: ${{ inputs.bake_minutes }}
          SHA: ${{ inputs.sha }}
        run: scripts/lambda/release-inputs.sh >> "$GITHUB_ENV"

      - name: Derive the resource names
        run: scripts/names.sh app >> "$GITHUB_ENV"

      - name: Download the image
        if: env.RELEASE_MODE == 'deploy'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: app-image
          path: ${{ runner.temp }}/image

      # The sha256 comes from the build job output, not from the artifact, so a replaced artifact is refused.
      - name: Load the image (sha256 verified)
        if: env.RELEASE_MODE == 'deploy'
        env:
          EXPECTED_SHA256: ${{ needs.build-scan.outputs.image-sha256 }}
        run: scripts/image/import.sh "$RUNNER_TEMP/image/image.tar" "$EXPECTED_SHA256"

      - name: Check configuration
        env:
          ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          REGION: ${{ vars.AWS_REGION }}
        run: scripts/aws/check-config.sh deploy

      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-deploy-${{ github.run_id }}-${{ github.run_attempt }}
          mask-aws-account-id: true
          retry-max-attempts: 3

      # The function is Active, the secret has a value, and the deploy role is denied it (N4). Exit code 3 means the
      # function does not exist yet (first run of the environment): a deploy still pushes, a rollback fails.
      - name: Preflight (function ready, secret set, N4)
        id: preflight
        run: |
          set -euo pipefail
          rc=0
          scripts/lambda/preflight.sh || rc=$?
          case "$rc" in
            0) echo "function=present" >> "$GITHUB_OUTPUT" ;;
            3)
              if [[ "$RELEASE_MODE" != "deploy" ]]; then
                echo "::error::nothing to roll back: the function ${FUNCTION} does not exist"
                exit 1
              fi
              echo "function=missing" >> "$GITHUB_OUTPUT"
              ;;
            *) exit "$rc" ;;
          esac

      # Push once, by immutable tag; a re-run reuses the image that was scanned. The digest comes from ECR.
      - name: Push the image to ECR
        if: env.RELEASE_MODE == 'deploy'
        env:
          ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          image="$(scripts/names.sh image "$TARGET_SHA")"
          scripts/image/ecr-push.sh "$REPOSITORY" "$TARGET_SHA" "$image" >> "$GITHUB_ENV"

      # Rollback: the digest ECR holds under the tag of the requested commit (pushed by an earlier run).
      - name: Resolve the rollback image
        if: env.RELEASE_MODE == 'rollback'
        run: scripts/lambda/resolve-image.sh "$TARGET_SHA" >> "$GITHUB_ENV"

      - name: Stop until the function exists
        if: steps.preflight.outputs.function == 'missing'
        run: |
          echo "::notice::function ${FUNCTION} not created yet: the image is in ECR; run terraform-iac apply for ${ENV}, then app-deploy (Run workflow)"
          echo "Function \`${FUNCTION}\` not created yet: image pushed, nothing released. Run terraform-iac apply for ${ENV}, then app-deploy." >> "$GITHUB_STEP_SUMMARY"

      # Code by digest, IMAGE_DIGEST, PublishVersion; or the existing version of this commit and digest (rollback).
      - name: Publish the version
        id: publish
        if: steps.preflight.outputs.function == 'present'
        env:
          ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          REGION: ${{ vars.AWS_REGION }}
        run: scripts/lambda/publish.sh "${ACCOUNT}.dkr.ecr.${REGION}.amazonaws.com/${REPOSITORY}" "$IMAGE_DIGEST" "$TARGET_SHA" >> "$GITHUB_OUTPUT"

      # The new version answers /health and /version before it gets any traffic.
      - name: Smoke-invoke the version
        if: steps.preflight.outputs.function == 'present'
        env:
          VERSION: ${{ steps.publish.outputs.VERSION }}
        run: scripts/lambda/smoke-invoke.sh "$VERSION" "$TARGET_SHA" "$IMAGE_DIGEST"

      - name: Find the API endpoint
        id: api
        if: steps.preflight.outputs.function == 'present'
        run: scripts/lambda/api-endpoint.sh >> "$GITHUB_OUTPUT"

      - name: Move live to the version (all at once)
        if: steps.preflight.outputs.function == 'present' && env.STRATEGY == 'all-at-once'
        env:
          VERSION: ${{ steps.publish.outputs.VERSION }}
        run: scripts/lambda/shift-alias.sh "$VERSION"

      # Weight, bake, then 100 percent. A failed bake fails the step; the next step removes the weight.
      - name: Canary, bake, then move live
        id: canary
        if: steps.preflight.outputs.function == 'present' && env.STRATEGY == 'canary'
        env:
          VERSION: ${{ steps.publish.outputs.VERSION }}
          API_ENDPOINT: ${{ steps.api.outputs.API_ENDPOINT }}
        run: |
          set -euo pipefail
          scripts/lambda/shift-alias.sh "$VERSION" --weight "$CANARY_PERCENT"
          scripts/lambda/canary-bake.sh "$API_ENDPOINT" "$VERSION" "$BAKE_MINUTES" >> "$GITHUB_OUTPUT"
          scripts/lambda/shift-alias.sh "$VERSION"

      # Runs when the canary step failed or the run was cancelled during the bake: the old version keeps 100 percent.
      - name: Abort the canary
        if: always() && (steps.canary.outcome == 'failure' || steps.canary.outcome == 'cancelled')
        run: |
          echo "::error::canary of the new version failed: removing its weight; the previous version keeps all traffic"
          scripts/lambda/shift-alias.sh --clear-weights

      - name: Verify live through the API
        if: steps.preflight.outputs.function == 'present'
        env:
          API_ENDPOINT: ${{ steps.api.outputs.API_ENDPOINT }}
        run: scripts/lambda/verify-live.sh "$API_ENDPOINT" "$TARGET_SHA" "$IMAGE_DIGEST"

      - name: Prune old versions
        id: prune
        if: steps.preflight.outputs.function == 'present'
        run: scripts/lambda/prune-versions.sh >> "$GITHUB_OUTPUT"

      # configure-aws-credentials masks the assumed-role ARN in logs, so the summary shows the role name (the helper
      # leaves the session name out: it carries the run ID). The Trivy result is in the build-scan job summary.
      - name: Summary
        if: always()
        env:
          ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          JOB_STATUS: ${{ job.status }}
          FUNCTION_STATE: ${{ steps.preflight.outputs.function }}
          VERSION: ${{ steps.publish.outputs.VERSION }}
          REUSED: ${{ steps.publish.outputs.REUSED }}
          CANARY_FAILED_PROBES: ${{ steps.canary.outputs.CANARY_FAILED_PROBES }}
          CANARY_ERRORS: ${{ steps.canary.outputs.CANARY_ERRORS }}
          PRUNED: ${{ steps.prune.outputs.PRUNED }}
        run: |
          set -euo pipefail
          case "${REUSED:-}" in
            true) version="${VERSION} (reused)" ;;
            false) version="${VERSION} (published)" ;;
            *) version="not published" ;;
          esac
          if [[ "${FUNCTION_STATE:-}" == "missing" ]]; then
            version="not published (the function does not exist yet: run terraform-iac apply)"
          fi
          canary="not run"
          if [[ "${STRATEGY:-}" == "canary" ]]; then
            canary="${CANARY_PERCENT:-?}% for ${BAKE_MINUTES:-?} min, failed probes ${CANARY_FAILED_PROBES:-not known}, errors ${CANARY_ERRORS:-not known}"
          fi
          role="$(scripts/names.sh role 2>/dev/null)" || role="not assumed"
          {
            echo "### app-deploy (${RELEASE_MODE:-not validated})"
            echo "Commit: \`${TARGET_SHA:-${GIT_SHA}}\`"
            echo "Image digest: \`${IMAGE_DIGEST:-not resolved}\`"
            echo "Version: ${version}"
            echo "Strategy: ${STRATEGY:-not validated}; canary: ${canary}"
            echo "Versions pruned: ${PRUNED:-not run}"
            echo "Result: ${JOB_STATUS}"
            echo "Role: \`${role}\`"
          } | scripts/aws/assert-no-account-id.sh >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the image files
        if: always()
        run: rm -rf "$RUNNER_TEMP/image"
