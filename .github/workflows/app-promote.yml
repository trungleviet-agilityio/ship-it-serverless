# App promote to prod (ADR 0012 L7, L8; ADR 0008 P9, P10, S2; ADR 0010; FR-13, FR-16).
# A manual run on main takes a commit SHA that app-deploy already released in dev, copies that exact image (same digest,
# no rebuild) from the dev ECR to the prod ECR, and releases it on the prod function like app-deploy does: publish a
# version (code by digest, IMAGE_DIGEST and the description), smoke-invoke it, move the alias `live` all at once or
# through a canary (probes invoke the alias through the Lambda API), prune old versions; then a job without credentials
# reads /version through the API. The strategy comes from the dispatch input (prod environment variables
# RELEASE_STRATEGY, CANARY_PERCENT and BAKE_MINUTES only fill an empty input, scripts/lambda/release-inputs.sh). Rollback is the same run with an earlier green SHA: the prod tag already
# holds that digest, so nothing is copied (scripts/image/promote-copy.sh), and the version of that SHA is reused when it
# still exists (scripts/lambda/publish.sh).
# The file path is part of the prod deploy role trust (ADR 0008 P7): bootstrap `workflow_files` lists app-promote.yml
# when promotion_source_account_id is set.
# Three jobs: `resolve` proves the SHA was green in dev (green `deploy (dev)` and `verify (dev)` jobs) with git and the
# GitHub API only (no token, no environment, no secret); `promote` is the only job that can assume the prod deploy role,
# after the prod environment is approved; `verify` reads /version through the HTTP API with no token, no environment
# and no secret, so no credentialed job needs an execute-api host (ADR 0012 L7, review M1).
# Jobs that assume an AWS role run harden-runner in block mode with telemetry off and an exact allowlist (ADR 0007 S39).
# Hosts holding an account ID come from secret expressions, never literals. The dev registry host is the one named
# exception of the harden-runner policy (ADR 0008 P8).
name: App Promote
run-name: Promote ${{ inputs.sha }} to ${{ inputs.env }} by ${{ github.actor }}

on:
  workflow_dispatch:
    inputs:
      env:
        description: Environment to promote to
        type: choice
        options: [prod]
        required: true
        default: prod
      sha:
        description: Full commit SHA on main that app-deploy deployed to dev (an earlier one rolls back)
        type: string
        required: true
      strategy:
        description: all-at-once moves live at once; canary sends canary_percent to the new version for bake_minutes first
        type: choice
        options: [all-at-once, canary]
        default: all-at-once
      canary_percent:
        description: Canary weight in percent (1 to 50)
        type: string
        default: "10"
      bake_minutes:
        description: Canary bake time in minutes (1 to 30)
        type: string
        default: "5"

permissions: {}

env:
  # The target environment. The scripts derive every target resource name from it (app_names in scripts/lib.sh).
  ENV: ${{ inputs.env }}

jobs:
  resolve:
    name: resolve (green in dev)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # No OIDC token, no deployment environment, no secrets: this job cannot reach AWS.
    permissions:
      contents: read
      actions: read # gh run list: the app-deploy run of the SHA
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      # The full history: the SHA must be an ancestor of origin/main.
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Require a green dev deploy of the SHA
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ inputs.sha }}
        run: scripts/image/promote-resolve.sh "$SHA"

  promote:
    name: promote (prod)
    needs: resolve
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # The environment adds the required reviewer and sets the OIDC subject the prod deploy role trusts.
    environment: ${{ inputs.env }}
    # One promotion of an environment at a time; a running one is never cancelled.
    concurrency:
      group: app-promote-${{ inputs.env }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # OIDC token for the role assumed by configure-aws-credentials
    # The verify job reads these. None holds an account ID; each was validated by the script that produced it, and
    # verify-live.sh validates them again.
    outputs:
      released: ${{ steps.release.outputs.released }}
      sha: ${{ steps.release.outputs.sha }}
      digest: ${{ steps.release.outputs.digest }}
      api-endpoint: ${{ steps.release.outputs.api-endpoint }}
    steps:
      # No execute-api host: the canary probes invoke the alias through the Lambda API, and /version through the HTTP API
      # is read by the verify job, which holds no credentials (ADR 0012 L7, review M1).
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: block
          disable-telemetry: true
          # crane copies registry to registry: no Docker, so containers stay off (ADR 0008 P9).
          disable-sudo-and-containers: true
          allowed-endpoints: >
            github.com:443
            release-assets.githubusercontent.com:443
            sts.${{ vars.AWS_REGION }}.amazonaws.com:443
            api.ecr.${{ vars.AWS_REGION }}.amazonaws.com:443
            ${{ secrets.AWS_ACCOUNT_ID_DEV }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com:443
            ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION }}.amazonaws.com:443
            prod-${{ vars.AWS_REGION }}-starport-layer-bucket.s3.${{ vars.AWS_REGION }}.amazonaws.com:443
            lambda.${{ vars.AWS_REGION }}.amazonaws.com:443
            apigateway.${{ vars.AWS_REGION }}.amazonaws.com:443
            monitoring.${{ vars.AWS_REGION }}.amazonaws.com:443
            secretsmanager.${{ vars.AWS_REGION }}.amazonaws.com:443

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Before any input is used: the dispatch inputs reach the script through env only.
      - name: Validate the release inputs
        env:
          MODE: promote
          SHA: ${{ inputs.sha }}
          STRATEGY: ${{ inputs.strategy }}
          CANARY_PERCENT: ${{ inputs.canary_percent }}
          BAKE_MINUTES: ${{ inputs.bake_minutes }}
          RELEASE_STRATEGY: ${{ vars.RELEASE_STRATEGY }}
          VARS_CANARY_PERCENT: ${{ vars.CANARY_PERCENT }}
          VARS_BAKE_MINUTES: ${{ vars.BAKE_MINUTES }}
        run: scripts/lambda/release-inputs.sh >> "$GITHUB_ENV"

      - name: Derive the resource names
        run: scripts/names.sh app >> "$GITHUB_ENV"

      - name: Install crane (checksum verified)
        run: scripts/ci/install-tools.sh "$RUNNER_TEMP/tools" crane

      - name: Check configuration
        env:
          ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          REGION: ${{ vars.AWS_REGION }}
        run: scripts/aws/check-config.sh deploy

      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: gha-promote-${{ github.run_id }}-${{ github.run_attempt }}
          mask-aws-account-id: true
          retry-max-attempts: 3

      # The function is Active, the secret has a value, and the deploy role is denied it (N4). Exit code 3 means the
      # prod function does not exist yet (first promotion): the image is still copied, then the run stops green.
      - name: Preflight (function ready, secret set, N4)
        id: preflight
        run: |
          set -euo pipefail
          rc=0
          scripts/lambda/preflight.sh || rc=$?
          case "$rc" in
            0) echo "function=present" >> "$GITHUB_OUTPUT" ;;
            3) echo "function=missing" >> "$GITHUB_OUTPUT" ;;
            *) exit "$rc" ;;
          esac

      # Copy by digest, or reuse the digest prod already holds for this SHA (rollback). Prints IMAGE_DIGEST and
      # PROMOTE_COPIED only; the registry hosts never reach the log.
      - name: Copy the image by digest
        env:
          SOURCE_ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID_DEV }}
          ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          source_name="$(ENV=dev scripts/names.sh app | sed -n 's/^REPOSITORY=//p')"
          [[ -n "$source_name" ]] || { echo "::error::no dev repository name"; exit 1; }
          source_repo="${SOURCE_ACCOUNT}.dkr.ecr.${REGION}.amazonaws.com/${source_name}"
          target_repo="${ACCOUNT}.dkr.ecr.${REGION}.amazonaws.com/${REPOSITORY}"
          out="$(scripts/image/promote-copy.sh "$source_repo" "$target_repo" "$TARGET_SHA" "$RUNNER_TEMP")"
          digest="$(sed -n 's/^IMAGE_DIGEST=//p' <<<"$out")"
          copied="$(sed -n 's/^PROMOTE_COPIED=//p' <<<"$out")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::promote-copy returned no digest"; exit 1; }
          [[ "$copied" =~ ^(true|false)$ ]] || { echo "::error::promote-copy returned no PROMOTE_COPIED"; exit 1; }
          {
            echo "IMAGE_DIGEST=${digest}"
            echo "PROMOTE_COPIED=${copied}"
          } >> "$GITHUB_ENV"

      - name: Stop until the function exists
        if: steps.preflight.outputs.function == 'missing'
        run: |
          echo "::notice::function ${FUNCTION} not created yet: the image is in the ${ENV} ECR; run terraform-iac apply for ${ENV}, then app-promote again"
          echo "Function \`${FUNCTION}\` not created yet: image copied, nothing released. Run terraform-iac apply for ${ENV}, then app-promote again." >> "$GITHUB_STEP_SUMMARY"

      # Code by digest, IMAGE_DIGEST, PublishVersion; or the existing version of this SHA and digest (rollback).
      - name: Publish the version
        id: publish
        if: steps.preflight.outputs.function == 'present'
        env:
          ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          REGION: ${{ vars.AWS_REGION }}
        run: scripts/lambda/publish.sh "${ACCOUNT}.dkr.ecr.${REGION}.amazonaws.com/${REPOSITORY}" "$IMAGE_DIGEST" "$TARGET_SHA" >> "$GITHUB_OUTPUT"

      # The version answers /health and /version before it gets any traffic.
      - name: Smoke-invoke the version
        if: steps.preflight.outputs.function == 'present'
        env:
          VERSION: ${{ steps.publish.outputs.VERSION }}
        run: scripts/lambda/smoke-invoke.sh "$VERSION" "$TARGET_SHA" "$IMAGE_DIGEST"

      - name: Find the API endpoint
        id: api
        if: steps.preflight.outputs.function == 'present'
        run: scripts/lambda/api-endpoint.sh >> "$GITHUB_OUTPUT"

      # A version that is already the primary is a no-op (shift-alias.sh prints a notice).
      - name: Move live to the version (all at once)
        if: steps.preflight.outputs.function == 'present' && env.STRATEGY == 'all-at-once'
        env:
          VERSION: ${{ steps.publish.outputs.VERSION }}
        run: scripts/lambda/shift-alias.sh "$VERSION"

      # Weight, bake (probes invoke the alias `live`), then 100 percent. A failed bake fails the step; the next step
      # removes the weight. A version that is already the primary gets no weight and no bake.
      - name: Canary, bake, then move live
        id: canary
        if: steps.preflight.outputs.function == 'present' && env.STRATEGY == 'canary'
        env:
          VERSION: ${{ steps.publish.outputs.VERSION }}
        run: |
          set -euo pipefail
          shifted="$(scripts/lambda/shift-alias.sh "$VERSION" --weight "$CANARY_PERCENT")"
          if grep -qx 'ALIAS_CHANGED=false' <<<"$shifted"; then
            echo "canary=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          scripts/lambda/canary-bake.sh "$VERSION" "$BAKE_MINUTES" >> "$GITHUB_OUTPUT"
          scripts/lambda/shift-alias.sh "$VERSION"

      # Runs when the canary step failed or the run was cancelled during the bake: the old version keeps 100 percent.
      - name: Abort the canary
        if: always() && (steps.canary.outcome == 'failure' || steps.canary.outcome == 'cancelled')
        run: |
          echo "::error::canary of the new version failed: removing its weight; the previous version keeps all traffic"
          scripts/lambda/shift-alias.sh --clear-weights

      # Hands the release to the verify job. Runs only when every release step above succeeded.
      - name: Hand the release to verify
        id: release
        if: steps.preflight.outputs.function == 'present'
        env:
          API_ENDPOINT: ${{ steps.api.outputs.API_ENDPOINT }}
        run: |
          set -euo pipefail
          {
            echo "released=true"
            echo "sha=${TARGET_SHA}"
            echo "digest=${IMAGE_DIGEST}"
            echo "api-endpoint=${API_ENDPOINT}"
          } >> "$GITHUB_OUTPUT"

      - name: Prune old versions
        id: prune
        if: steps.preflight.outputs.function == 'present'
        run: scripts/lambda/prune-versions.sh >> "$GITHUB_OUTPUT"

      - name: Summary
        if: always()
        env:
          ACCOUNT: ${{ secrets.AWS_ACCOUNT_ID }}
          JOB_STATUS: ${{ job.status }}
          SHA: ${{ inputs.sha }}
          FUNCTION_STATE: ${{ steps.preflight.outputs.function }}
          VERSION: ${{ steps.publish.outputs.VERSION }}
          REUSED: ${{ steps.publish.outputs.REUSED }}
          CANARY_SKIPPED: ${{ steps.canary.outputs.canary }}
          CANARY_HITS: ${{ steps.canary.outputs.CANARY_NEW_HITS }}
          CANARY_FAILED_PROBES: ${{ steps.canary.outputs.CANARY_FAILED_PROBES }}
          CANARY_ERRORS: ${{ steps.canary.outputs.CANARY_ERRORS }}
          PRUNED: ${{ steps.prune.outputs.PRUNED }}
        run: |
          set -euo pipefail
          case "${PROMOTE_COPIED:-}" in
            true) how="copied from dev by digest" ;;
            false) how="already in ${ENV} (rollback or re-run): reused" ;;
            *) how="not resolved" ;;
          esac
          case "${REUSED:-}" in
            true) version="${VERSION} (reused)" ;;
            false) version="${VERSION} (published)" ;;
            *) version="not published" ;;
          esac
          if [[ "${FUNCTION_STATE:-}" == "missing" ]]; then
            version="not published (the function does not exist yet: run terraform-iac apply)"
          fi
          canary="not run"
          if [[ "${STRATEGY:-}" == "canary" ]]; then
            canary="${CANARY_PERCENT:-?}% for ${BAKE_MINUTES:-?} min, probes on the new version ${CANARY_HITS:-not known}, failed probes ${CANARY_FAILED_PROBES:-not known}, errors ${CANARY_ERRORS:-not known}"
            if [[ "${CANARY_SKIPPED:-}" == "skipped" ]]; then canary="skipped (the version was already live)"; fi
          fi
          role="$(scripts/names.sh role 2>/dev/null)" || role="not assumed"
          {
            echo "### app-promote"
            echo "Commit: \`${TARGET_SHA:-${SHA}}\`"
            echo "Image digest: \`${IMAGE_DIGEST:-not resolved}\` (${how})"
            echo "Version: ${version}"
            echo "Strategy: ${STRATEGY:-not validated}; canary: ${canary}"
            echo "Versions pruned: ${PRUNED:-not run}"
            echo "Result: ${JOB_STATUS} (the verify job reads /version through the API next)"
            echo "Role: \`${role}\`"
          } | scripts/aws/assert-no-account-id.sh >> "$GITHUB_STEP_SUMMARY"

  # The front-door check (ADR 0012 L6, L7; review M1): GET /version through the HTTP API must show the released commit
  # and digest. No OIDC token, no deployment environment, no secrets, so this is the only job that may talk to an
  # execute-api host, and harden-runner stays in audit like every job without credentials.
  verify:
    name: verify (prod)
    needs: promote
    if: needs.promote.outputs.released == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # verify-live.sh matches the endpoint against the API endpoint pattern before any request.
      - name: Verify live through the API
        env:
          API_ENDPOINT: ${{ needs.promote.outputs.api-endpoint }}
          RELEASED_SHA: ${{ needs.promote.outputs.sha }}
          RELEASED_DIGEST: ${{ needs.promote.outputs.digest }}
        run: scripts/lambda/verify-live.sh "$API_ENDPOINT" "$RELEASED_SHA" "$RELEASED_DIGEST"
