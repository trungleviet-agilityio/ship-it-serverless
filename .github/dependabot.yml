# Version updates (NFR-5, ADR 0007 S5). One monthly PR per ecosystem, with a cooldown so a bad release can be pulled
# before it is proposed (security updates ignore the cooldown). Commit titles read `<prefix>(deps): ...`.
# Not covered, so they get a monthly manual check (PROGRESS): the two image digests in app/Dockerfile, the tool
# versions in mise.toml with
# scripts/ci/tools.sha256, and scripts/ci/requirements.txt (a uv-compiled, hash-locked file; no `pip` entry on purpose).
# Terraform PRs from the bot get no plan (no secrets for Dependabot). Re-open one from a maintainer branch before
# merging it, so the plan role runs.
version: 2

updates:
  # Every workflow and the local composite action in one PR. The version stays in the comment after the SHA.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/terraform-setup
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]

  # No `docker` entry (ADR 0012, docs/tradeoffs.md section 17): both images in app/Dockerfile live on public.ecr.aws
  # (the Python base and the Lambda Web Adapter), and Dependabot's registry proxy cannot authenticate to ECR Public
  # (runs failed with "DENIED: Not Authorized"; upstream https://github.com/dependabot/proxy/issues/157). Bump both
  # digests by hand once a month with the pin-versions skill; App CI rebuilds and Trivy-scans every bump. Re-add the
  # entry when the upstream issue is fixed.

  # Provider and lock file updates. The globs pick up envs/prod in Phase 7.
  - package-ecosystem: terraform
    directories:
      - /infra/terraform/bootstrap
      - /infra/terraform/envs/*
      - /infra/terraform/modules/*
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: infra
      include: scope
    groups:
      terraform:
        patterns: ["*"]

  # Hook revs in .pre-commit-config.yaml. Keep only while the PRs preserve the `# frozen: vX` comments (ADR 0007 Q4).
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      hooks:
        patterns: ["*"]
